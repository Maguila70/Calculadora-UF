name: Build APK

on:
  push:
    branches:
      - claude/homeassistant-tablet-dashboard-JA8pC
      - main
    paths:
      - 'ha_tablet_dashboard/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha_tablet_dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-tablet-dashboard-apk
          path: ha_tablet_dashboard/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release APK name with date
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ha-tablet-dashboard-${DATE}.apk
          echo "APK_NAME=ha-tablet-dashboard-${DATE}.apk" >> $GITHUB_ENV

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: ha-tablet-dashboard-release
          path: ha_tablet_dashboard/build/app/outputs/flutter-apk/ha-tablet-dashboard-*.apk
          retention-days: 90
